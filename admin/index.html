<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмінка — BEST</title>
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<style>/* ============================================================
   BEST admin — same tokens as the public site, own layout.
   ============================================================ */
:root{
  --bg:#050505; --surface:#0c0c0c; --surface-2:#101010; --surface-3:#151515;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.14); --line-3:rgba(255,255,255,.22);
  --text:#ffffff; --text-dim:rgba(255,255,255,.62);
  --accent-700:#a8835c; --accent-600:#cca377; --accent-450:#e0bc94; --accent-300:#f2d09b; --accent-200:#fbdba2;
  --accent-grad:linear-gradient(115deg,#fbdba2 0%,#cca377 48%,#fbdba2 100%);
  --on-accent:#1a1206;
  --ok:#8fd49a; --warn:#f0c37a; --err:#f0968a;
  --r-sm:12px; --r-md:18px; --r-lg:24px;
  --ff-display:"Inter Tight","Inter",system-ui,sans-serif;
  --ff-body:"Inter",system-ui,-apple-system,sans-serif;
  --ff-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --rail:16rem;
  --pad:clamp(1.25rem,2.2vw,2rem);   /* inset inside a panel */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--ff-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(38% 46% at 8% 0%,rgba(204,163,119,.16),transparent 70%),
    radial-gradient(34% 40% at 98% 8%,rgba(251,219,162,.10),transparent 72%);
}
h1,h2,h3{font-family:var(--ff-display);font-weight:500;letter-spacing:-.025em;margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-300);outline-offset:2px;border-radius:6px}

.mono{font-family:var(--ff-mono)}
.muted{color:var(--text-dim)}
[hidden]{display:none !important}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.72rem 1.15rem;min-height:44px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#fff;
  font-family:var(--ff-mono);font-size:.8125rem;letter-spacing:.1em;text-transform:uppercase;
  transition:background-color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease);
  white-space:nowrap;
}
.btn:hover{background-color:rgba(255,255,255,.08);transform:translateY(-1px)}
.btn:active{transform:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn--primary{background:var(--accent-grad);color:var(--on-accent);border-color:transparent;font-weight:700}
.btn--primary:hover{background:var(--accent-grad);filter:brightness(1.06)}
.btn--danger{border-color:rgba(240,150,138,.4);color:var(--err)}
.btn--danger:hover{background-color:rgba(240,150,138,.12)}
.btn--sm{padding:.45rem .8rem;min-height:38px;font-size:.75rem}
.btn--icon{padding:0;width:38px;min-height:38px;border-radius:10px}

/* ---------- login ---------- */
.login{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:1.5rem}
.login__card{
  width:min(100%,24rem);padding:clamp(1.75rem,4vw,2.5rem);
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  box-shadow:0 30px 80px -40px #000;
}
.login__logo{display:block;width:11rem;height:auto;margin:0 auto 1.75rem}
.login h1{font-size:1.3rem;text-align:center;margin-bottom:.4rem}
.login p{text-align:center;color:var(--text-dim);font-size:.9375rem;margin:0 0 1.75rem}
.login .field{margin-bottom:1rem}
.login .btn{width:100%}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.rail{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:.35rem;
  padding:1.5rem 1rem;border-right:1px solid var(--line);background:rgba(8,8,8,.8);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.rail__logo{width:9.5rem;height:auto;margin:.25rem .35rem 1.75rem}
.rail__tag{
  font-family:var(--ff-mono);font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-dim);padding:0 .85rem;margin-bottom:.6rem;
}
.rail a.nav,.rail button.nav{
  display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
  padding:.7rem .85rem;min-height:44px;border-radius:12px;border:1px solid transparent;
  background:none;cursor:pointer;font-size:.9375rem;text-decoration:none;
  transition:background-color .25s var(--ease),color .25s var(--ease);
}
.rail .nav:hover{background:rgba(255,255,255,.05)}
.rail .nav.is-active{background:rgba(204,163,119,.14);border-color:rgba(204,163,119,.3);color:var(--accent-200)}
.rail .nav svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.rail__spacer{flex:1}
.rail__foot{display:grid;gap:.35rem;border-top:1px solid var(--line);padding-top:.9rem;margin-top:.9rem}

.main-wrap{min-width:0;display:flex;flex-direction:column}
.main{min-width:0;padding:clamp(1.25rem,2.5vw,2.25rem) clamp(1.25rem,3vw,2.75rem) 7rem}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.75rem}
.page-top h1{font-size:clamp(1.4rem,2.4vw,1.9rem)}
.page-top p{margin:.45rem 0 0;color:var(--text-dim);font-size:.9375rem;max-width:56ch}
.stamp{
  display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .8rem;border-radius:999px;
  border:1px solid var(--line);font-family:var(--ff-mono);font-size:.75rem;color:var(--text-dim);
}
.stamp i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}

/* ---------- panels, fields ---------- */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.panel + .panel{margin-top:1rem}
.panel__head{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding:1.1rem var(--pad);border-bottom:1px solid var(--line);background:rgba(255,255,255,.015);
}
.panel__head h2{font-size:1.05rem}
.panel__head p{margin:.25rem 0 0;font-size:.875rem;color:var(--text-dim)}
.panel__body{padding:var(--pad)}

.field{display:block}
.field__k{
  display:block;margin-bottom:.4rem;font-family:var(--ff-mono);font-size:.6875rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);
}
.input,textarea.input,select.input{
  width:100%;padding:.7rem .9rem;min-height:44px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#fff;
  transition:border-color .25s var(--ease),background-color .25s var(--ease);
}
.input:hover{border-color:var(--line-3)}
.input:focus{border-color:var(--accent-600);background:rgba(255,255,255,.05);outline:none}
textarea.input{min-height:7rem;resize:vertical;line-height:1.6}
.input--mono{font-family:var(--ff-mono)}
.input.is-bad{border-color:var(--err);background:rgba(240,150,138,.07)}
.hint{margin:.4rem 0 0;font-size:.8125rem;color:var(--text-dim)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.stack{display:grid;gap:1.15rem}

/* ---------- rates ---------- */
.rates-head,.rate-line{
  display:grid;grid-template-columns:minmax(10rem,1.6fr) repeat(4,minmax(6rem,1fr));
  gap:.75rem;align-items:center;
}
.rates-head{
  padding:0 var(--pad) .7rem;font-family:var(--ff-mono);font-size:.6875rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);
}
.rates-head span{text-align:center}
.rates-head span:first-child{text-align:left}
.rates-head .grp{grid-column:span 2;text-align:center;color:var(--accent-600)}
.rate-line{padding:.5rem var(--pad);border-top:1px solid var(--line)}
.rate-line:nth-child(odd){background:rgba(255,255,255,.015)}
.rate-cur{display:flex;align-items:center;gap:.7rem;min-width:0}
.rate-cur__code{font-family:var(--ff-mono);font-weight:700;font-size:.9375rem}
.rate-cur__label{display:block;font-size:.8125rem;color:var(--text-dim);line-height:1.3}
.rate-cur__flag{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;overflow:hidden;
  border:1px solid var(--line-2);background:#111;display:grid;place-items:center;
  font-family:var(--ff-mono);font-size:.625rem;color:var(--accent-200);
}
.rate-in{position:relative}
.rate-in input{
  width:100%;padding:.6rem .7rem;min-height:44px;text-align:center;
  font-family:var(--ff-mono);font-size:1.0625rem;font-weight:700;
  border-radius:10px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:#fff;
  transition:border-color .2s var(--ease),background-color .2s var(--ease);
  -moz-appearance:textfield;
}
.rate-in input::-webkit-outer-spin-button,.rate-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rate-in input:focus{border-color:var(--accent-600);background:rgba(251,219,162,.07);outline:none}
.rate-in.is-dirty input{border-color:var(--accent-600);box-shadow:0 0 0 3px rgba(204,163,119,.14)}
.rate-in.is-bad input{border-color:var(--err);background:rgba(240,150,138,.08)}
.rate-in__unit{
  position:absolute;right:.55rem;top:50%;transform:translateY(-50%);
  font-family:var(--ff-mono);font-size:.75rem;color:var(--text-dim);pointer-events:none;
}
.rate-note{padding:1rem var(--pad);border-top:1px solid var(--line);font-size:.8125rem;color:var(--text-dim)}

/* ---------- save bar ---------- */
.savebar{
  position:fixed;left:var(--rail);right:0;bottom:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding:.9rem clamp(1.25rem,3vw,2.75rem);
  border-top:1px solid var(--line);background:rgba(8,8,8,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(110%);transition:transform .35s var(--ease);
}
.savebar.is-up{transform:none}
.savebar__msg{font-size:.9375rem;display:flex;align-items:center;gap:.6rem;min-width:0}
.savebar__msg b{color:var(--accent-200);font-weight:500}
.savebar__actions{display:flex;gap:.6rem;flex-wrap:wrap}

/* ---------- lists ---------- */
.rows{display:grid}
.row-item{
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
  padding:1rem var(--pad);border-top:1px solid var(--line);
}
.row-item:first-child{border-top:0}
.row-item__main{flex:1;min-width:14rem}
.row-item__main b{display:block;font-weight:500;font-size:1rem}
.row-item__main span{font-size:.8125rem;color:var(--text-dim)}
.row-item__actions{display:flex;gap:.5rem;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .65rem;border-radius:999px;
  border:1px solid var(--line-2);font-family:var(--ff-mono);font-size:.6875rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);
}
.pill--live{border-color:rgba(143,212,154,.35);color:var(--ok)}
.pill--draft{border-color:rgba(240,195,122,.35);color:var(--warn)}

/* ---------- image picker ---------- */
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:.6rem;max-height:17rem;overflow:auto}
.imgs button{
  padding:0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#000;cursor:pointer;
  aspect-ratio:4/3;transition:border-color .2s var(--ease)
}
.imgs button:hover{border-color:var(--line-3)}
.imgs button.is-on{border-color:var(--accent-600);box-shadow:0 0 0 3px rgba(204,163,119,.18)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- toast ---------- */
.toasts{position:fixed;top:1rem;right:1rem;z-index:60;display:grid;gap:.5rem;max-width:min(26rem,calc(100vw - 2rem))}
.toast{
  padding:.8rem 1.1rem;border-radius:var(--r-sm);border:1px solid var(--line-2);
  background:rgba(16,16,16,.96);box-shadow:0 20px 50px -24px #000;font-size:.9375rem;
  animation:toast-in .35s var(--ease);
}
.toast--ok{border-color:rgba(143,212,154,.4)}
.toast--err{border-color:rgba(240,150,138,.5)}
@keyframes toast-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:1.5rem}
.dialog{width:min(100%,28rem);padding:1.6rem;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface-2)}
.dialog h2{font-size:1.1rem;margin-bottom:.6rem}
.dialog p{color:var(--text-dim);font-size:.9375rem;margin:0 0 1.4rem}
.dialog__actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}

/* ---------- mobile ---------- */
.rail__burger{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;inset:0 auto 0 0;width:min(17rem,82vw);z-index:40;
    transform:translateX(-102%);transition:transform .35s var(--ease);
  }
  .rail.is-open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .rail__burger{
    display:inline-flex;position:fixed;top:.85rem;left:.85rem;z-index:45;
    width:44px;height:44px;align-items:center;justify-content:center;border-radius:12px;
    border:1px solid var(--line-2);background:rgba(10,10,10,.9);cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .rail__burger svg{width:18px;height:18px}
  .main{padding-top:4.5rem}
  .savebar{left:0}
  .grid-2{grid-template-columns:1fr}
  .rates-head{display:none}
  .rate-line{
    grid-template-columns:1fr 1fr;gap:.55rem .6rem;padding:1rem var(--pad);
    border-top:1px solid var(--line-2);
  }
  .rate-cur{grid-column:1 / -1;margin-bottom:.1rem}
  .rate-in::before{
    content:attr(data-k);display:block;margin-bottom:.3rem;
    font-family:var(--ff-mono);font-size:.625rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text-dim);text-align:center;
  }
}

/* ---------- showcase banner ---------- */
.login__demo{
  margin:0 0 1rem;padding:.7rem .9rem;border-radius:var(--r-sm);
  border:1px solid rgba(240,195,122,.32);background:rgba(240,195,122,.07);
  font-size:.875rem;color:var(--warn);text-align:center;
}
.login__demo b{font-family:var(--ff-mono);color:var(--accent-200);letter-spacing:.04em}
.demo-note{
  margin:clamp(1.25rem,2.5vw,2.25rem) clamp(1.25rem,3vw,2.75rem) -.5rem;
  padding:.9rem 1.15rem;border-radius:var(--r-sm);
  border:1px solid rgba(240,195,122,.3);background:rgba(240,195,122,.07);
  font-size:.9375rem;line-height:1.5;color:var(--text);
}
.demo-note b{color:var(--warn);font-weight:500}

/* ---------- texts: block nav + live preview ---------- */
.texts{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:1.25rem;align-items:start}
.texts__nav{
  position:sticky;top:clamp(1.25rem,2.5vw,2.25rem);display:grid;gap:.2rem;
  padding:.6rem;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
}
.texts__link{
  display:block;width:100%;text-align:left;padding:.6rem .8rem;min-height:40px;
  border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;
  font-size:.9375rem;color:var(--text-dim);
  transition:background-color .2s var(--ease),color .2s var(--ease);
}
.texts__link:hover{background:rgba(255,255,255,.05);color:#fff}
.texts__link.is-on{background:rgba(204,163,119,.14);border-color:rgba(204,163,119,.3);color:var(--accent-200)}
.texts__cols{min-width:0}

/* sticky needs a panel that is not its own scroll container */
.panel--split{overflow:visible}
.panel__split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,21rem)}
.tprev{
  align-self:start;position:sticky;top:clamp(1.25rem,2.5vw,2.25rem);
  margin:var(--pad) var(--pad) var(--pad) 0;padding:1.25rem;
  border:1px solid var(--line);border-radius:var(--r-md);
  background:
    radial-gradient(70% 120% at 12% 0%,rgba(204,163,119,.13),transparent 70%),
    #060606;
}
.tprev__tag{
  display:block;margin-bottom:1rem;font-family:var(--ff-mono);font-size:.625rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);
}
.tprev__body-box{display:grid;gap:.7rem}
.tprev__label{
  font-family:var(--ff-mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase;color:#fff;
}
.tprev__label::before{content:"[ "}
.tprev__label::after{content:" ]"}
.tprev__head{
  margin:0;font-family:var(--ff-display);font-size:clamp(1.2rem,1.7vw,1.5rem);
  font-weight:500;letter-spacing:-.03em;line-height:1.1;color:#fff;
}
.tprev__head .accent,.tprev__head.accent{
  background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.tprev__body{margin:0;font-size:.9375rem;line-height:1.6;color:#fff}
.tprev__body b{color:#fff;font-weight:600}
.tprev__small{margin:0;font-family:var(--ff-mono);font-size:.8125rem;color:var(--text-dim)}

@media (max-width:900px){
  .texts{grid-template-columns:1fr}
  .texts__nav{
    position:static;grid-auto-flow:column;grid-auto-columns:max-content;gap:.4rem;
    overflow-x:auto;padding:.5rem;scrollbar-width:thin;
  }
  .texts__link{white-space:nowrap}
}

@media (max-width:1280px){
  .panel__split{grid-template-columns:1fr}
  .tprev{position:static;order:-1;margin:var(--pad) var(--pad) 0}
  .panel__split > .panel__body{order:1}
}
</style>
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<div class="login" id="login" hidden>
  <form class="login__card" id="loginForm" autocomplete="on">
    <img class="login__logo" src="/images/logo.svg" alt="BESTOBMIN" width="1975" height="531">
    <h1>Панель керування</h1>
    <p>Введіть пароль, щоб редагувати сайт</p>
    <label class="field">
      <span class="field__k">Пароль</span>
      <input class="input" type="password" id="pw" name="password" autocomplete="current-password" required>
    </label>
    <p class="hint" id="loginErr" role="alert" style="color:var(--err)" hidden></p>
    <p class="login__demo" id="loginDemo" hidden>Демонстраційна версія · пароль <b id="demoPass"></b></p>
    <button class="btn btn--primary" type="submit" id="loginBtn">Увійти</button>
  </form>
</div>

<!-- ============================ APP ============================ -->
<button class="rail__burger" id="burger" type="button" aria-label="Меню" hidden>
  <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
</button>

<div class="app" id="app" hidden>
  <nav class="rail" id="rail" aria-label="Розділи">
    <img class="rail__logo" src="/images/logo.svg" alt="BESTOBMIN" width="1975" height="531">
    <span class="rail__tag">Керування сайтом</span>

    <button class="nav is-active" type="button" data-view="rates">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2.5 12.5 6.5 8l3 2.5L15.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 4h4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Курси валют
    </button>
    <button class="nav" type="button" data-view="posts">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="13" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 6.5h7M5.5 9.5h7M5.5 12h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Новини
    </button>
    <button class="nav" type="button" data-view="branches">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 16s5.5-4.7 5.5-8.8A5.5 5.5 0 0 0 3.5 7.2C3.5 11.3 9 16 9 16Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="7.2" r="2" stroke="currentColor" stroke-width="1.4"/></svg>
      Відділення
    </button>
    <button class="nav" type="button" data-view="texts">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 5h10M4 9h10M4 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Тексти сайту
    </button>

    <div class="rail__spacer"></div>
    <div class="rail__foot">
      <a class="nav" href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 14 14 4M6.5 4H14v7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Відкрити сайт
      </a>
      <button class="nav" type="button" id="logout">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M11 5V3.5a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M7.5 9h8m0 0-2.5-2.5M15.5 9 13 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Вийти
      </button>
    </div>
  </nav>

  <div class="main-wrap">
    <div class="demo-note" id="demoNote" hidden>
      <b>Демонстраційна версія.</b> Так панель виглядає й працює в житті, але це вітрина:
      зміни лишаються на екрані до перезавантаження сторінки й на сайт не потрапляють.
    </div>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="savebar" id="savebar">
  <div class="savebar__msg" id="savebarMsg"></div>
  <div class="savebar__actions">
    <button class="btn btn--sm" type="button" id="revert">Скасувати</button>
    <button class="btn btn--primary btn--sm" type="button" id="save">Зберегти зміни</button>
  </div>
</div>

<script>(function () {
  'use strict';

  /* ============================================================
     plumbing
     ============================================================ */
  var CSRF = null;
  var dirty = null;          // { label, save(), revert() } while there are unsaved edits

  /* ---------- showcase mode ----------
     With no server behind it (a static preview host), the panel runs on a
     snapshot so the client can walk through every screen. Nothing is
     stored and nothing can be: there is no endpoint to store it in. The
     real deployment answers /api/me, so this never switches on there. */
  var DEMO = false;
  var DEMO_PASS = 'demo2026';
  var snap = null;
  var clone = function (v) { return JSON.parse(JSON.stringify(v)); };

  function demoApi(method, url, body) {
    return new Promise(function (resolve) {
      setTimeout(function () {
        var post = /^\/api\/admin\/posts\/(.+)$/.exec(url);
        if (method === 'GET') {
          if (url === '/api/admin/rates') return resolve(clone(snap.rates));
          if (url === '/api/admin/branches') return resolve(clone(snap.branches));
          if (url === '/api/admin/texts') return resolve(clone(snap.texts));
          if (url === '/api/admin/images') return resolve({ images: snap.images.slice() });
          if (url === '/api/admin/posts') {
            return resolve({ posts: snap.posts.map(function (x) {
              return { slug: x.slug, title: x.title, date: x.date, tag: x.tag, draft: x.draft };
            }) });
          }
          if (post) {
            var found = snap.posts.filter(function (x) { return x.slug === post[1]; })[0];
            return resolve(found ? clone(found) : {});
          }
          return resolve({});
        }
        /* keep the edit on screen for the rest of the visit, then forget it */
        if (url === '/api/admin/rates') snap.rates = clone(body);
        if (url === '/api/admin/branches') snap.branches = clone(body);
        if (url === '/api/admin/texts') snap.texts = clone(body);
        if (post) {
          var slug = post[1];
          var rest = snap.posts.filter(function (x) { return x.slug !== slug; });
          if (method === 'PUT') rest.unshift(Object.assign({ slug: slug }, clone(body)));
          snap.posts = rest;
        }
        resolve({ ok: true });
      }, 120);
    });
  }

  function api(method, url, body) {
    if (DEMO) return demoApi(method, url, body);
    var opts = { method: method, headers: {}, credentials: 'same-origin' };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    if (method !== 'GET' && CSRF) opts.headers['X-CSRF-Token'] = CSRF;
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { showLogin('Сесія завершилась — увійдіть знову'); throw new Error('auth'); }
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || ('Помилка ' + r.status));
        return d;
      });
    });
  }

  /* Views fetch before they paint. If the user switches screens meanwhile,
     the older fetch must not land on top of the newer screen. */
  var renderSeq = 0;
  var stale = function (mine) { return mine !== renderSeq; };

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };

  function toast(msg, kind) {
    if (DEMO && kind !== 'err') msg = 'Демо-режим: зміни видно на екрані, але вони не зберігаються';
    var t = el('div', 'toast toast--' + (kind || 'ok'), msg);
    $('#toasts').appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .3s, transform .3s';
      t.style.opacity = '0'; t.style.transform = 'translateX(12px)';
      setTimeout(function () { t.remove(); }, 320);
    }, kind === 'err' ? 6000 : 3000);
  }

  function confirmDialog(title, text, okLabel) {
    return new Promise(function (resolve) {
      var scrim = el('div', 'scrim');
      var box = el('div', 'dialog');
      box.appendChild(el('h2', null, title));
      box.appendChild(el('p', null, text));
      var acts = el('div', 'dialog__actions');
      var no = el('button', 'btn btn--sm', 'Скасувати');
      var yes = el('button', 'btn btn--sm btn--danger', okLabel || 'Видалити');
      acts.appendChild(no); acts.appendChild(yes);
      box.appendChild(acts); scrim.appendChild(box); document.body.appendChild(scrim);
      yes.focus();
      var close = function (v) { scrim.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
      var onKey = function (e) { if (e.key === 'Escape') close(false); };
      no.onclick = function () { close(false); };
      yes.onclick = function () { close(true); };
      scrim.onclick = function (e) { if (e.target === scrim) close(false); };
      document.addEventListener('keydown', onKey);
    });
  }

  /* ---------- unsaved-changes bar ---------- */
  function setDirty(state) {
    dirty = state;
    var bar = $('#savebar');
    bar.classList.toggle('is-up', !!state);
    if (state) $('#savebarMsg').innerHTML = '<b>' + state.count + '</b>&nbsp;' + state.label;
  }
  $('#save').onclick = function () { if (dirty) dirty.save(); };
  $('#revert').onclick = function () { if (dirty) dirty.revert(); };
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (dirty) dirty.save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  var plural = function (n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  };

  /* ============================================================
     RATES — the screen the cashier opens every morning
     ============================================================ */
  function viewRates(main) {
    var mine = ++renderSeq;
    main.innerHTML = '';
    api('GET', '/api/admin/rates').then(function (data) {
      if (stale(mine)) return;
      var edited = JSON.parse(JSON.stringify(data));

      var top = el('div', 'page-top');
      var left = el('div');
      left.appendChild(el('h1', null, 'Курси валют'));
      left.appendChild(el('p', null, DEMO
        ? 'У робочій панелі збережена зміна зʼявляється на сайті протягом кількох секунд — перезбірка не потрібна.'
        : 'Зміна зберігається одразу й зʼявляється на сайті протягом кількох секунд — перезбірка не потрібна.'));
      top.appendChild(left);
      var stamp = el('span', 'stamp');
      stamp.appendChild(el('i'));
      stamp.appendChild(el('span', null, 'Оновлено ' + whenText(data.updatedAt)));
      top.appendChild(stamp);
      main.appendChild(top);

      /* -- header fields -- */
      var head = el('div', 'panel');
      var hb = el('div', 'panel__body grid-2');
      hb.appendChild(labelled('Дата в заголовку сайту', inputFor('headline', data.headline, 'напр. 24 вересня'), 'Показується як «Актуальні курси на …».'));
      hb.appendChild(labelled('Оптовий курс діє від, у.о.', inputFor('wholesaleMin', data.wholesaleMin, '500'), 'Нижче цієї суми калькулятор рахує за роздрібним курсом.'));
      head.appendChild(hb);
      main.appendChild(head);

      function inputFor(key, value, ph) {
        var i = el('input', 'input input--mono');
        i.value = value; i.placeholder = ph || '';
        i.oninput = function () { edited[key] = key === 'wholesaleMin' ? i.value : i.value; mark(); };
        return i;
      }
      function labelled(k, node, hint) {
        var wrap = el('label', 'field');
        wrap.appendChild(el('span', 'field__k', k));
        wrap.appendChild(node);
        if (hint) wrap.appendChild(el('p', 'hint', hint));
        return wrap;
      }

      /* -- the table -- */
      var panel = el('div', 'panel');
      var ph = el('div', 'panel__head');
      var phl = el('div');
      phl.appendChild(el('h2', null, 'Курси'));
      phl.appendChild(el('p', null, 'Купівля — скільки ви платите клієнту. Продаж — скільки платить клієнт. Стрілки ↑↓ змінюють на 1 копійку.'));
      ph.appendChild(phl);
      panel.appendChild(ph);

      var heads = el('div', 'rates-head');
      heads.appendChild(el('span', null, 'Валюта'));
      heads.appendChild(el('span', 'grp', 'Оптовий (від ' + data.wholesaleMin + ' у.о.)'));
      heads.appendChild(el('span', 'grp', 'Роздрібний'));
      panel.appendChild(heads);
      var sub = el('div', 'rates-head');
      sub.appendChild(el('span', null, ''));
      ['Купівля', 'Продаж', 'Купівля', 'Продаж'].forEach(function (t) { sub.appendChild(el('span', null, t)); });
      sub.style.paddingBottom = '.5rem';
      panel.appendChild(sub);

      /* Show a rate the way the site prints it — two decimals unless the
         number carries more. Per-cent tiers keep their own shape. */
      function showRate(v, unit) {
        if (unit === '%') return String(v);
        var dec = (String(v).split('.')[1] || '').length;
        return Number(v).toFixed(Math.max(2, dec));
      }

      var cells = [];
      data.rows.forEach(function (row, idx) {
        var line = el('div', 'rate-line');
        var cur = el('div', 'rate-cur');
        var flag = el('span', 'rate-cur__flag', row.code.split(' ')[0]);
        cur.appendChild(flag);
        var names = el('span');
        names.appendChild(el('b', 'rate-cur__code', row.code));
        names.appendChild(el('span', 'rate-cur__label', row.label));
        cur.appendChild(names);
        line.appendChild(cur);

        ['w', 'r'].forEach(function (t) {
          ['buy', 'sell'].forEach(function (side) {
            var tier = row[t];
            var box = el('div', 'rate-in');
            box.setAttribute('data-k', (t === 'w' ? 'Опт' : 'Розд') + ' · ' + (side === 'buy' ? 'купівля' : 'продаж'));
            if (!tier) {
              var dash = el('input');
              dash.value = '—'; dash.disabled = true; dash.setAttribute('aria-label', 'не застосовується');
              box.appendChild(dash); line.appendChild(box); return;
            }
            var input = el('input');
            input.type = 'text';
            input.inputMode = 'decimal';
            input.value = showRate(tier[side], tier.unit);
            input.setAttribute('aria-label', row.code + ' ' + (t === 'w' ? 'оптовий' : 'роздрібний') + ' ' + (side === 'buy' ? 'купівля' : 'продаж'));
            if (tier.unit === '%') box.appendChild(el('span', 'rate-in__unit', '%'));
            box.appendChild(input);
            line.appendChild(box);

            var original = input.value;
            var cell = { input: input, box: box, idx: idx, t: t, side: side, original: original };
            cells.push(cell);

            input.oninput = function () {
              var n = parseFloat(input.value.replace(',', '.'));
              edited.rows[idx][t][side] = isFinite(n) ? n : input.value;
              box.classList.toggle('is-dirty', String(input.value) !== String(original));
              validate();
              mark();
            };
            input.onblur = function () {
              if (!NUMERIC.test(input.value.trim())) return;
              var n = parseFloat(input.value.replace(',', '.'));
              if (isFinite(n)) { input.value = showRate(n, tier.unit); input.oninput(); }
            };
            input.onkeydown = function (e) {
              if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
              e.preventDefault();
              var n = parseFloat(input.value.replace(',', '.'));
              if (!isFinite(n)) return;
              var step = tier.unit === '%' ? 0.1 : (Math.abs(n) < 1 ? 0.001 : 0.01);
              input.value = String(Math.round((n + (e.key === 'ArrowUp' ? step : -step)) * 1e4) / 1e4);
              input.oninput();
            };
          });
        });
        panel.appendChild(line);
      });

      var note = el('div', 'rate-note', 'Продаж не може бути меншим за купівлю — такий рядок підсвічується червоним і не збережеться.');
      panel.appendChild(note);
      main.appendChild(panel);

      /* Text that merely starts with digits is not a number: parseFloat
         would quietly turn "44.5.9" into 44.5 and save it. */
      var NUMERIC = /^-?\d{1,7}([.,]\d{1,4})?$/;

      function validate() {
        var bad = 0;
        data.rows.forEach(function (row, idx) {
          ['w', 'r'].forEach(function (t) {
            if (!row[t]) return;
            var pair = cells.filter(function (c) { return c.idx === idx && c.t === t; });
            var malformed = pair.filter(function (c) { return !NUMERIC.test(c.input.value.trim()); });
            malformed.forEach(function (c) { c.box.classList.add('is-bad'); });
            if (malformed.length) {
              pair.forEach(function (c) { if (malformed.indexOf(c) < 0) c.box.classList.remove('is-bad'); });
              bad += malformed.length;
              return;
            }
            var buy = parseFloat(String(edited.rows[idx][t].buy).replace(',', '.'));
            var sell = parseFloat(String(edited.rows[idx][t].sell).replace(',', '.'));
            var ok = isFinite(buy) && isFinite(sell) && sell >= buy;
            pair.forEach(function (c) { c.box.classList.toggle('is-bad', !ok); });
            if (!ok) bad++;
          });
        });
        $('#save').disabled = bad > 0;
        return bad === 0;
      }

      function mark() {
        var n = cells.filter(function (c) { return String(c.input.value) !== String(c.original); }).length;
        var fieldsChanged = String(edited.headline) !== String(data.headline)
          || String(edited.wholesaleMin) !== String(data.wholesaleMin);
        if (!n && !fieldsChanged) { setDirty(null); return; }
        setDirty({
          count: n || 1,
          label: n ? plural(n, 'курс змінено', 'курси змінено', 'курсів змінено') : 'поле змінено',
          save: function () {
            if (!validate()) { toast('Виправте підсвічені рядки', 'err'); return; }
            $('#save').disabled = true;
            api('PUT', '/api/admin/rates', edited).then(function (r) {
              setDirty(null);
              toast('Курси збережено — за кілька секунд зʼявляться на сайті');
              $('#save').disabled = false;
              viewRates(main);
              if (r.saved) stamp.lastChild.textContent = 'Оновлено щойно';
            }).catch(function (e) {
              $('#save').disabled = false;
              toast(e.message, 'err');
            });
          },
          revert: function () { setDirty(null); viewRates(main); },
        });
      }
    }).catch(fail(main));
  }

  function whenText(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1) return 'щойно';
    if (mins < 60) return mins + ' ' + plural(mins, 'хвилину', 'хвилини', 'хвилин') + ' тому';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + ' ' + plural(hrs, 'годину', 'години', 'годин') + ' тому';
    return d.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long' });
  }

  /* ============================================================
     POSTS
     ============================================================ */
  var TAGS = ['Курси', 'Валюти', 'Поради', 'Новини', 'Блог'];

  function viewPosts(main) {
    var mine = ++renderSeq;
    main.innerHTML = '';
    setDirty(null);
    api('GET', '/api/admin/posts').then(function (d) {
      if (stale(mine)) return;
      var top = el('div', 'page-top');
      var left = el('div');
      left.appendChild(el('h1', null, 'Новини'));
      left.appendChild(el('p', null, DEMO
        ? 'Статті блогу. У робочій панелі після збереження сайт перезбирається автоматично.'
        : 'Статті блогу. Після збереження сайт перезбирається автоматично — зміна зʼявиться приблизно за хвилину.'));
      top.appendChild(left);
      var add = el('button', 'btn btn--primary', 'Нова стаття');
      add.onclick = function () { editPost(main, null); };
      top.appendChild(add);
      main.appendChild(top);

      var panel = el('div', 'panel');
      var rows = el('div', 'rows');
      if (!d.posts.length) {
        rows.appendChild(el('div', 'row-item muted', 'Ще немає жодної статті.'));
      }
      d.posts.forEach(function (p) {
        var item = el('div', 'row-item');
        var m = el('div', 'row-item__main');
        m.appendChild(el('b', null, p.title || p.slug));
        m.appendChild(el('span', null, (p.date || '') + ' · ' + (p.tag || '—') + ' · /blog/' + p.slug));
        item.appendChild(m);
        item.appendChild(el('span', 'pill ' + (p.draft ? 'pill--draft' : 'pill--live'), p.draft ? 'Чернетка' : 'На сайті'));
        var acts = el('div', 'row-item__actions');
        var edit = el('button', 'btn btn--sm', 'Редагувати');
        edit.onclick = function () { editPost(main, p.slug); };
        var del = el('button', 'btn btn--sm btn--danger', 'Видалити');
        del.onclick = function () {
          confirmDialog('Видалити статтю?', '«' + (p.title || p.slug) + '» зникне з сайту. Дію не можна скасувати.').then(function (yes) {
            if (!yes) return;
            api('DELETE', '/api/admin/posts/' + p.slug)
              .then(function () { toast('Статтю видалено'); viewPosts(main); })
              .catch(function (e) { toast(e.message, 'err'); });
          });
        };
        acts.appendChild(edit); acts.appendChild(del);
        item.appendChild(acts);
        rows.appendChild(item);
      });
      panel.appendChild(rows);
      main.appendChild(panel);
    }).catch(fail(main));
  }

  function slugify(s) {
    var map = { а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ie',ж:'zh',з:'z',и:'y',і:'i',ї:'i',й:'i',к:'k',л:'l',м:'m',
                н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'iu',я:'ia',"'":'' };
    return String(s).toLowerCase().split('').map(function (c) { return map[c] !== undefined ? map[c] : c; }).join('')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70);
  }

  function editPost(main, slug) {
    var mine = ++renderSeq;
    main.innerHTML = '';
    var loading = slug
      ? api('GET', '/api/admin/posts/' + slug)
      : Promise.resolve({ title: '', date: new Date().toISOString().slice(0, 10), tag: 'Курси',
                          image: '', imageAlt: '', excerpt: '', draft: true, body: '' });

    Promise.all([loading, api('GET', '/api/admin/images')]).then(function (res) {
      if (stale(mine)) return;
      var post = res[0], images = res[1].images;
      var state = JSON.parse(JSON.stringify(post));
      var nextSlug = slug || '';

      var top = el('div', 'page-top');
      var left = el('div');
      left.appendChild(el('h1', null, slug ? 'Редагування статті' : 'Нова стаття'));
      left.appendChild(el('p', null, slug ? '/blog/' + slug : 'Адреса складеться із заголовка.'));
      top.appendChild(left);
      var back = el('button', 'btn', '← До списку');
      back.onclick = function () {
        if (!dirty) return viewPosts(main);
        confirmDialog('Вийти без збереження?', 'Незбережені зміни зникнуть.', 'Вийти').then(function (y) { if (y) { setDirty(null); viewPosts(main); } });
      };
      top.appendChild(back);
      main.appendChild(top);

      var panel = el('div', 'panel');
      var body = el('div', 'panel__body stack');

      body.appendChild(field('Заголовок', 'title', 'input', 'Про що стаття'));
      var meta = el('div', 'grid-2');
      meta.appendChild(field('Дата', 'date', 'date'));
      meta.appendChild(field('Рубрика', 'tag', 'select'));
      body.appendChild(meta);
      body.appendChild(field('Анонс', 'excerpt', 'textarea', 'Одне-два речення — показуються на картці й у соцмережах'));

      /* image picker */
      var imgWrap = el('div', 'field');
      imgWrap.appendChild(el('span', 'field__k', 'Обкладинка'));
      var grid = el('div', 'imgs');
      var none = el('button', '', '');
      none.type = 'button';

  /* The preview mirrors how the block is built on the page: a small mono
     label, a heading where **word** turns gold, then body copy. It is
     rebuilt from the fields on every keystroke, so what the client reads
     here is what the site will show. */
  var ROLE = {
    eyebrow: 'label', badge: 'label',
    heading: 'head', line1: 'head', line2: 'head-accent', title: 'head',
    lede: 'body', lead: 'body', note1: 'body', note2: 'body',
    about: 'body', legal: 'small', meta: 'small',
  };

  var headlineNow = '';   /* the date the build drops into {headline} */

  function renderPreview(box, group, state) {
    box.innerHTML = '';
    var keys = Object.keys(state).filter(function (k) { return k.indexOf(group.pre) === 0; });
    keys.forEach(function (key) {
      var short = key.split('.')[1];
      var role = ROLE[short] || 'body';
      var value = String(state[key] || '').replace('{headline}', headlineNow);
      if (!value.trim()) return;
      if (role === 'label') { box.appendChild(el('span', 'tprev__label', value)); return; }
      if (role === 'small') { box.appendChild(el('p', 'tprev__small', value)); return; }
      if (role === 'body')  { box.appendChild(richLine(el('p', 'tprev__body'), value)); return; }

      var h = el('p', 'tprev__head');
      if (role === 'head-accent') h.className += ' accent';
      value.split('\n').forEach(function (line, i) {
        if (i) h.appendChild(document.createElement('br'));
        accentInto(h, line);
      });
      box.appendChild(h);
    });
    if (!box.children.length) box.appendChild(el('p', 'tprev__body muted', 'Поля порожні'));
  }

  /* **word** becomes gold; everything else stays text, never markup */
  function accentInto(node, line) {
    var re = /\*\*(.+?)\*\*/g, last = 0, m;
    while ((m = re.exec(line))) {
      if (m.index > last) node.appendChild(document.createTextNode(line.slice(last, m.index)));
      node.appendChild(el('span', 'accent', m[1]));
      last = re.lastIndex;
    }
    if (last < line.length) node.appendChild(document.createTextNode(line.slice(last)));
  }
  function richLine(node, value) {
    value.split('\n').forEach(function (line, i) {
      if (i) node.appendChild(document.createElement('br'));
      var re = /\*\*(.+?)\*\*/g, last = 0, m;
      while ((m = re.exec(line))) {
        if (m.index > last) node.appendChild(document.createTextNode(line.slice(last, m.index)));
        node.appendChild(el('b', null, m[1]));
        last = re.lastIndex;
      }
      if (last < line.length) node.appendChild(document.createTextNode(line.slice(last)));
    });
    return node;
  }

      .then(function (res) {
        btn.disabled = false; btn.textContent = 'Увійти';
        if (!res.ok) {
          err.textContent = res.d.error || 'Не вдалося увійти';
          err.style.color = 'var(--err)'; err.hidden = false;
          $('#pw').select();
          return;
        }
        CSRF = res.d.csrf;
        $('#pw').value = '';
        err.hidden = true;
        showApp();
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Увійти';
        err.textContent = 'Сервер недоступний'; err.style.color = 'var(--err)'; err.hidden = false;
      });
  };

  function startDemo() {
    return fetch('/assets/demo.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { showLogin('Сервер недоступний'); return; }
        DEMO = true;
        snap = d;
        document.body.classList.add('is-demo');
        $('#demoNote').hidden = false;
        $('#loginDemo').hidden = false;
        $('#demoPass').textContent = DEMO_PASS;
        showLogin();
      })
      .catch(function () { showLogin('Сервер недоступний'); });
  }

  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) {
      if (!r.ok) throw new Error('no api');
      return r.json();
    })
    .then(function (d) { if (d.authed) { CSRF = d.csrf; showApp(); } else showLogin(); })
    .catch(startDemo);
})();
</script>
</body>
</html>
