
<!-- ============================ RATES ============================ -->
<section class="section rates" id="rates">
  <div class="shell">
    <div class="section-head reveal">
      <div>
        <span class="eyebrow">{{rates.eyebrow}}</span>
        <h2 class="h-section">{{rates.heading|head}}</h2>
      </div>
      <div class="section-head__aside">
        <p class="lede" style="margin-bottom:1.25rem">{{rates.lede}}</p>
        <span class="stamp"><span class="stamp__dot"></span>Оновлено <span id="ratesTime">щойно</span></span>
      </div>
    </div>

    <div class="rate-tabs" role="tablist" aria-label="Тип курсу">
      <button type="button" role="tab" aria-selected="true" aria-controls="rt-w" data-panel="rt-w">
        Оптовий курс <span>(від 500 у.о.)</span>
      </button>
      <button type="button" role="tab" aria-selected="false" aria-controls="rt-r" data-panel="rt-r">
        Роздрібний курс
      </button>
    </div>

<!--{{RATES_TABLE}}-->

    <div class="rates__note reveal">
      <div class="rates__note-text">
        <p>{{rates.note1}}</p>
        <p>{{rates.note2}}</p>
      </div>
      <a class="btn btn--sm" href="#exchange">Зафіксувати курс
        <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 9.5 9.5 2.5M4 2.5h5.5V8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
</section>
