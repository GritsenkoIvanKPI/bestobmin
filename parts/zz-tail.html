
<script>
(function () {
  'use strict';

  /* ---------- scroll reveal ---------- */
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
  document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });

  /* ---------- sticky header ---------- */
  var header = document.querySelector('.site-header');
  var onScroll = function () { header.classList.toggle('is-stuck', window.scrollY > 24); };
  onScroll();
  window.addEventListener('scroll', onScroll, { passive: true });

  /* ---------- mobile nav ---------- */
  var burger = document.getElementById('burger');
  var nav = document.getElementById('nav');
  burger.addEventListener('click', function () {
    var open = burger.getAttribute('aria-expanded') === 'true';
    burger.setAttribute('aria-expanded', String(!open));
    nav.classList.toggle('is-open', !open);
  });
  nav.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') { burger.setAttribute('aria-expanded', 'false'); nav.classList.remove('is-open'); }
  });

  /* ---------- branch dropdown ---------- */
  var pick = document.getElementById('branchPick');
  pick.addEventListener('click', function (e) {
    e.stopPropagation();
    pick.setAttribute('aria-expanded', String(pick.getAttribute('aria-expanded') !== 'true'));
  });
  document.addEventListener('click', function () { pick.setAttribute('aria-expanded', 'false'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { pick.setAttribute('aria-expanded', 'false'); }
  });

  /* ---------- rates timestamp ---------- */
  var t = document.getElementById('ratesTime');
  if (t) {
    var d = new Date();
    t.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  /* ---------- exchange calculator ---------- */
  /* Rates are quoted against UAH: `buy` is what the office pays the client
     for 1 unit, `sell` is what the client pays to get 1 unit. */
  var CUR = {
    UAH:    { flag: 'uah',  code: 'UAH',  buy: 1,     sell: 1     },
    USD100: { flag: 'usd',  code: 'USD',  buy: 44.65, sell: 44.90 },
    USD:    { flag: 'usd',  code: 'USD',  buy: 44.55, sell: 44.79 },
    EUR:    { flag: 'eur',  code: 'EUR',  buy: 51.70, sell: 51.93 },
    GBP:    { flag: 'gbp',  code: 'GBP',  buy: 59.80, sell: 60.35 },
    PLN:    { flag: 'pln',  code: 'PLN',  buy: 11.87, sell: 12.00 },
    CHF:    { flag: 'chf',  code: 'CHF',  buy: 54.90, sell: 55.59 },
    CAD:    { flag: 'cad',  code: 'CAD',  buy: 31.30, sell: 31.99 },
    CZK:    { flag: 'czk',  code: 'CZK',  buy: 2.02,  sell: 2.12  },
    SEK:    { flag: 'sek',  code: 'SEK',  buy: 3.95,  sell: 4.25  },
    HUF:    { flag: 'huf',  code: 'HUF',  buy: 0.12,  sell: 0.142 },
    /* USDT is quoted as a spread on the cash dollar: +1.6% / +2.9% */
    USDT:   { flag: 'usdt', code: 'USDT', buy: 44.65 * 1.016, sell: 44.90 * 1.029 }
  };

  /* Published cross rates win over the one derived through UAH. */
  var CROSS = {
    'EUR>USD100': 1.156, 'EUR>USD': 1.156,
    'USD100>EUR': 1 / 1.165, 'USD>EUR': 1 / 1.165
  };

  function nf(n, dec) {
    return n.toLocaleString('uk-UA', { minimumFractionDigits: dec, maximumFractionDigits: dec })
            .replace(/ /g, ' ');
  }
  function parseAmt(v) {
    var n = parseFloat(String(v).replace(/[^\d.,-]/g, '').replace(/\s/g, '').replace(',', '.'));
    return isFinite(n) && n > 0 ? n : 0;
  }
  /* how many units of `to` one unit of `from` buys */
  function rateBetween(from, to) {
    if (from === to) return 1;
    var key = from + '>' + to;
    if (CROSS[key]) return CROSS[key];
    return CUR[from].buy / CUR[to].sell;
  }
  function rateLabel(from, to) {
    var r = rateBetween(from, to);
    return '1 ' + CUR[from].code + ' = ' + nf(r, r >= 10 ? 2 : 4) + ' ' + CUR[to].code;
  }

  /* One converter = two currency pickers + two amounts + a swap button,
     found by data attributes inside `root`. Either amount drives the other. */
  function Converter(root, onChange) {
    var q  = function (sel) { return root.querySelector(sel); };
    var cf = q('[data-cur="from"]'), ct = q('[data-cur="to"]');
    var af = q('[data-amt="from"]'), at = q('[data-amt="to"]');
    var ff = q('[data-flag="from"]'), ft = q('[data-flag="to"]');

    function setFlag(el, c) { if (el) el.querySelector('use').setAttribute('href', '#fl-' + CUR[c].flag); }
    function state() {
      return { from: cf.value, to: ct.value, give: parseAmt(af.value), get: parseAmt(at.value),
               rate: rateBetween(cf.value, ct.value) };
    }
    function recalc(source) {
      var f = cf.value, t = ct.value, rate = rateBetween(f, t);
      setFlag(ff, f); setFlag(ft, t);
      if (source === 'to') af.value = nf(rate ? parseAmt(at.value) / rate : 0, 2);
      else                 at.value = nf(parseAmt(af.value) * rate, 2);
      if (onChange) onChange(state());
    }
    function avoidSame(changed) {
      if (cf.value !== ct.value) return;
      (changed === cf ? ct : cf).value = (changed.value === 'UAH') ? 'USD100' : 'UAH';
    }

    af.addEventListener('input', function () { recalc('from'); });
    at.addEventListener('input', function () { recalc('to'); });
    cf.addEventListener('change', function () { avoidSame(cf); recalc('from'); });
    ct.addEventListener('change', function () { avoidSame(ct); recalc('from'); });
    q('[data-swap]').addEventListener('click', function () {
      var c = cf.value, v = af.value;
      cf.value = ct.value; af.value = at.value;
      ct.value = c;        at.value = v;
      recalc('from');
    });
    recalc('from');

    return {
      state: state,
      set: function (from, to, give) {
        cf.value = from; ct.value = to; af.value = nf(give, give % 1 ? 2 : 0); recalc('from');
      }
    };
  }

  /* full request form */
  var usedRateEl = document.getElementById('usedRate');
  var sumFromEl  = document.getElementById('sumFrom');
  var sumToEl    = document.getElementById('sumTo');
  var mainCalc = Converter(document.getElementById('exchangeForm'), function (st) {
    usedRateEl.textContent = rateLabel(st.from, st.to);
    sumFromEl.textContent  = nf(st.give, 2) + ' ' + CUR[st.from].code;
    sumToEl.textContent    = nf(st.get, 2)  + ' ' + CUR[st.to].code;
  });

  /* compact converter on the first screen */
  var heroCalcEl = document.querySelector('.hero-calc');
  if (heroCalcEl) {
    var heroRate = heroCalcEl.querySelector('[data-rate]');
    var heroCalc = Converter(heroCalcEl, function (st) { heroRate.textContent = rateLabel(st.from, st.to); });
    /* "Оформити заявку" carries the pair and amount into the full form */
    heroCalcEl.querySelector('[data-submit]').addEventListener('click', function () {
      var st = heroCalc.state();
      mainCalc.set(st.from, st.to, st.give);
      setTimeout(function () {
        var nameInput = document.querySelector('#exchangeForm input[name="name"]');
        if (nameInput) nameInput.focus({ preventScroll: true });
      }, 700);
    });
  }

  /* ---------- forms ---------- */
  function handleForm(formId, okId) {
    var form = document.getElementById(formId);
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var phone = form.querySelector('input[type="tel"]');
      if (phone && phone.value.replace(/\D/g, '').length < 9) { phone.focus(); return; }
      document.getElementById(okId).classList.add('is-on');
      form.querySelectorAll('input[type="tel"],input[type="text"][name]').forEach(function (i) { i.value = ''; });
    });
  }
  handleForm('exchangeForm', 'formOk');
  handleForm('callbackForm', 'callbackOk');

  /* ---------- reviews carousel ---------- */
  var track = document.getElementById('revTrack');
  var prev = document.getElementById('revPrev');
  var next = document.getElementById('revNext');
  var bar = document.getElementById('revBar');
  var idx = 0;

  function perView() { return window.matchMedia('(max-width:880px)').matches ? 1 : 2; }
  function maxIdx() { return Math.max(0, track.children.length - perView()); }

  function render() {
    idx = Math.min(idx, maxIdx());
    var card = track.children[0];
    var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
    track.style.transform = 'translate3d(-' + (idx * (card.offsetWidth + gap)) + 'px,0,0)';
    prev.disabled = idx === 0;
    next.disabled = idx >= maxIdx();
    var total = maxIdx() + 1;
    bar.style.width = (100 / total) + '%';
    bar.style.transform = 'translateX(' + (idx * 100) + '%)';
  }
  prev.addEventListener('click', function () { idx = Math.max(0, idx - 1); render(); });
  next.addEventListener('click', function () { idx = Math.min(maxIdx(), idx + 1); render(); });
  window.addEventListener('resize', render);
  render();

  /* ---------- FAQ accordion ---------- */
  document.querySelectorAll('.acc').forEach(function (acc) {
    var btn = acc.querySelector('.acc__btn');
    btn.addEventListener('click', function () {
      var open = acc.classList.contains('is-open');
      document.querySelectorAll('.acc').forEach(function (a) {
        a.classList.remove('is-open');
        a.querySelector('.acc__btn').setAttribute('aria-expanded', 'false');
      });
      if (!open) { acc.classList.add('is-open'); btn.setAttribute('aria-expanded', 'true'); }
    });
  });

  /* ---------- map tabs ---------- */
  var BRANCHES = [
    {
      q: 'Івано-Франківськ, вулиця Чорновола, 4',
      addr: 'м. Івано-Франківськ, вул. Чорновола, 4',
      phones: [['+380664972619', '(066) 49-72-619'], ['+380989248391', '(098) 92-48-391']],
      hours: 'Пн–Пт 9:00–18:30<br>Сб 9:00–17:30<br><span style="color:var(--text-4)">Нд — вихідний</span>'
    },
    {
      q: 'Івано-Франківськ, вулиця Лепкого, 14',
      addr: 'м. Івано-Франківськ, вул. Лепкого, 14',
      phones: [['+380996469697', '(099) 64-69-697'], ['+380676781337', '(067) 67-81-337']],
      hours: 'Щодня 8:00–19:00<br><span style="color:var(--text-4)">Без вихідних</span>'
    },
    {
      q: 'Івано-Франківськ, вулиця Вовчинецька, 190',
      addr: 'м. Івано-Франківськ, вул. Вовчинецька, 190',
      phones: [['+380960963778', '(096) 09-63-778']],
      hours: 'Пн–Сб 9:00–18:30<br>Нд 9:00–19:00'
    }
  ];

  var frame = document.getElementById('mapFrame');
  document.querySelectorAll('.map-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      var b = BRANCHES[+tab.dataset.idx];
      document.querySelectorAll('.map-tab').forEach(function (t2) { t2.setAttribute('aria-selected', String(t2 === tab)); });
      frame.src = 'https://www.google.com/maps?q=' + encodeURIComponent(b.q) + '&z=16&output=embed&hl=uk';
      document.getElementById('cAddr').textContent = b.addr;
      document.getElementById('cPhones').innerHTML = b.phones.map(function (p) {
        return '<a class="mono" href="tel:' + p[0] + '">' + p[1] + '</a>';
      }).join('');
      document.getElementById('cHours').innerHTML = b.hours;
      document.getElementById('cRoute').href = 'https://maps.google.com/?q=' + encodeURIComponent(b.q);
    });
  });

  /* ---------- smooth anchor scroll ---------- */
  document.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var id = a.getAttribute('href');
      if (id.length < 2) return;
      var target = document.querySelector(id);
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
})();
</script>
</body>
</html>
